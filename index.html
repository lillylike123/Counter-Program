 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Program</title>
    <link rel="stylesheet" href="style.css">
 </head>

 <header>
    <h1>Counter Program</h1>
   
 </header>
    
 <body class = "light"><div class = "theme-container">
   <canvas id="particleCanvas"></canvas>
   <label for="themeSelect">Theme:  </label>
   <select id="themeSelect">
      <option value="light">Light Mode</option>
      <option value="dark">Dark Mode </option>
      <option value="cyberpunk">CyberPunk</option>
      <option value="cute">Cute</option>
   </select>
</div>
    
<div id = "counterCard">
   <div id="comboLabel" class="hidden">0x Combo! 🔥</div>
   
   <label id="countLabel">0</label><br>

   <div class = "multiplier-container">
      <button class ="mult-btn active" data-mult="1">x1</button>
      <button class ="mult-btn active" data-mult="5">x5</button>
      <button class ="mult-btn active" data-mult="10">x10</button>

   </div>


    <div id="btnContainer">
      <button id="decreaseBtn" class="buttons">Decrease</button>  
      <button id="resetBtn" class="buttons">Reset</button>  
      <button id="increaseBtn" class="buttons">Increase</button>  
   </div>
</div>
 
     <script src="index.js"></script>
 </body>
 </html>
